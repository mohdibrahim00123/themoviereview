<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TheMovieReview.online - Legal Movie Reviews & Trailers</title>
    <style>
        body { font-family: Arial, sans-serif; background: #121212; color: #fff; margin: 0; padding: 0; }
        
        /* Navbar Styling */
        nav { background: #1a1a1a; border-bottom: 2px solid #333; padding: 10px 20px; display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; }
        
        .brand-container { display: flex; align-items: center; text-decoration: none; }
        .logo-icon { width: 34px; height: 34px; fill: #e50914; margin-right: 8px; }
        .logo-text { font-size: 18px; font-weight: bold; color: #fff; letter-spacing: 0.5px; }
        .logo-text span { color: #e50914; }

        /* Category Menu Bar */
        .cat-bar { background: #000; padding: 10px 20px; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; border-bottom: 1px solid #222; }
        .btn-cat { background: #1e1e1e; color: #fff; border: none; padding: 8px 14px; border-radius: 4px; cursor: pointer; font-size: 13px; font-weight: bold; transition: background 0.3s; }
        .btn-cat:hover, .btn-cat.active { background: #e50914; }
        .btn-special { background: #ffc107; color: #000; }
        
        .search-box { padding: 8px 15px; font-size: 14px; border-radius: 4px; border: 1px solid #444; background: #222; color: #fff; outline: none; width: 200px; margin-left: auto; }
        .search-box:focus { border-color: #e50914; }

        .main-content { padding: 25px; max-width: 1200px; margin: auto; }
        h2 { border-left: 4px solid #e50914; padding-left: 10px; margin-top: 10px; font-size: 20px; color: #fff; }
        
        .container { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 20px; margin-top: 20px; }
        .movie-card { background: #1e1e1e; border-radius: 6px; overflow: hidden; box-shadow: 0 4px 10px rgba(0,0,0,0.3); transition: transform 0.3s; cursor: pointer; }
        .movie-card:hover { transform: scale(1.03); }
        .movie-card img { width: 100%; height: 300px; object-fit: cover; }
        .movie-info { padding: 12px; }
        .movie-info h3 { font-size: 15px; margin: 0 0 8px; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .movie-info p { color: #aaa; font-size: 13px; margin: 0; }
        .no-result { text-align: center; grid-column: 1/-1; color: #aaa; font-size: 18px; margin-top: 30px; }

        /* Modal Styles */
        .modal { display: none; position: fixed; z-index: 100; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.85); overflow-y: auto; padding: 20px; box-sizing: border-box; }
        .modal-content { background-color: #1a1a1a; margin: 40px auto; padding: 25px; border-radius: 8px; width: 100%; max-width: 600px; box-shadow: 0 5px 15px rgba(0,0,0,0.5); position: relative; }
        .close-btn { color: #aaa; float: right; font-size: 28px; font-weight: bold; cursor: pointer; }
        .close-btn:hover { color: #fff; }
        .modal-content h2 { margin-top: 0; color: #fff; border: none; }
        .modal-content p { color: #ccc; line-height: 1.6; font-size: 14px; }
        .btn-ott { display: inline-block; background: #e50914; color: #fff; padding: 10px 20px; border-radius: 5px; text-decoration: none; margin-top: 15px; font-weight: bold; }
        .btn-ott:hover { background: #b20710; }

        /* Footer */
        footer { text-align: center; padding: 25px; border-top: 1px solid #333; margin-top: 40px; color: #777; font-size: 13px; }
    </style>
</head>
<body>

    <!-- Top Navigation Bar with Logo -->
    <nav>
        <a href="#" class="brand-container">
            <svg class="logo-icon" viewBox="0 0 24 24">
                <path d="M18 4l2 4h-3l-2-4h-2l2 4h-3l-2-4H8l2 4H7L5 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V4h-4zM10 15l5-3-5-3v6z"/>
            </svg>
            <span class="logo-text">TheMovieReview<span>.online</span></span>
        </a>
    </nav>

    <!-- Category Menu Bar -->
    <div class="cat-bar">
        <button class="btn-cat btn-special" onclick="filterCategory('All')">🎬 All Movies</button>
        <button class="btn-cat" onclick="filterCategory('Bollywood')">Bollywood</button>
        <button class="btn-cat" onclick="filterCategory('Hollywood')">Hollywood</button>
        <button class="btn-cat" onclick="filterCategory('South Hindi')">South Hindi</button>
        <button class="btn-cat" onclick="filterCategory('Web Series')">Web Series</button>
        
        <input type="text" id="search-input" class="search-box" placeholder="Search movies..." onkeyup="filterMovies()">
    </div>

    <div class="main-content">
        <h2 id="section-title">🔥 Latest Releases & Reviews</h2>
        <div class="container" id="movie-grid">
            <!-- Movies will load here -->
        </div>
    </div>

    <!-- Movie Detail Modal -->
    <div id="movieModal" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal()">&times;</span>
            <h2 id="modal-title">Movie Title</h2>
            <p><strong>Category:</strong> <span id="modal-cat" style="color:#e50914;"></span></p>
            <p><strong>Rating:</strong> <span id="modal-rating"></span> | <strong>Release Year:</strong> <span id="modal-year"></span></p>
            <p><strong>Detailed Review:</strong> <span id="modal-review"></span></p>
            <p><strong>Official Trailer:</strong></p>
            <div id="modal-trailer-container"></div>
            <br>
            <a id="modal-ott-link" href="#" target="_blank" class="btn-ott">Watch on Official OTT / Legal Partner</a>
        </div>
    </div>

    <footer>
        <p>&copy; 2026 TheMovieReview.online | 100% Legal Reviews, Trailers & OTT Guide</p>
    </footer>

    <script>
        const movies = [
            { 
                title: "Inception", 
                category: "Hollywood",
                poster_path: "https://image.tmdb.org/t/p/w500/edv5CZvWj09upOsy2Y6IwDhK8bt.jpg", 
                vote_average: 8.8, 
                release_date: "2010",
                review: "Christopher Nolan ki yeh sci-fi masterpiece dimaag ke saare taar hila deti hai. Dream-sharing concept aur visual effects bejod hain.",
                trailer: "https://www.youtube.com/embed/YoHD9XEInc0",
                ott_link: "https://www.netflix.com"
            },
            { 
                title: "Interstellar", 
                category: "Hollywood",
                poster_path: "https://image.tmdb.org/t/p/w500/gEU2QniE6E77NI6lCU6MxlNBvIx.jpg", 
                vote_average: 8.7, 
                release_date: "2014",
                review: "Space, time dilation, aur baap-beti ke emotional bond par bani yeh film cinema history ki sabse behtareen sci-fi films mein se ek hai.",
                trailer: "https://www.youtube.com/embed/zSWdZVtXT7E",
                ott_link: "https://www.primevideo.com"
            },
            { 
                title: "The Dark Knight", 
                category: "Hollywood",
                poster_path: "https://image.tmdb.org/t/p/w500/qJ2tW6WMUDux911r6m7haRef0WH.jpg", 
                vote_average: 9.0, 
                release_date: "2008",
                review: "Heath Ledger ka Joker aur Christian Bale ka Batman—yeh movie superhero genre ki definition badal deti hai.",
                trailer: "https://www.youtube.com/embed/EXeTwQWrcwY",
                ott_link: "https://www.primevideo.com"
            },
            { 
                title: "Pushpa 2 (Sample)", 
                category: "South Hindi",
                poster_path: "https://image.tmdb.org/t/p/w500/t6HIqrRAclMCA60NsSmeqe9RmNV.jpg", 
                vote_average: 8.5, 
                release_date: "2024",
                review: "Allu Arjun ka swag aur action sequence is movie ko blockbuster banate hain. Mass entertainment ka poora dose.",
                trailer: "https://www.youtube.com/embed/1kVPzZcbbx8",
                ott_link: "https://www.primevideo.com"
            },
            { 
                title: "Scam 1992 (Sample)", 
                category: "Web Series",
                poster_path: "https://image.tmdb.org/t/p/w500/8Gxv8gSFCU0XGDykEGv7zR1n2ua.jpg", 
                vote_average: 9.3, 
                release_date: "2020",
                review: "Harshad Mehta ki life par bani yeh web series Indian OTT history ki sabse zabardast series mein se ek hai.",
                trailer: "https://www.youtube.com/embed/isukUbwmwHM",
                ott_link: "https://www.sonyliv.com"
            }
        ];

        let currentCategory = 'All';

        function displayMovies(movieList) {
            const grid = document.getElementById('movie-grid');
            grid.innerHTML = '';
            
            if(movieList.length === 0) {
                grid.innerHTML = '<div class="no-result">Is category mein koi movie nahi mili!</div>';
                return;
            }

            movieList.forEach(movie => {
                const { title, poster_path, vote_average, release_date } = movie;
                const card = document.createElement('div');
                card.classList.add('movie-card');
                card.onclick = () => openModal(movie);
                
                card.innerHTML = `
                    <img src="${poster_path}" alt="${title}">
                    <div class="movie-info">
                        <h3>${title}</h3>
                        <p>⭐ ${vote_average} | 📅 ${release_date}</p>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function filterCategory(category) {
            currentCategory = category;
            document.getElementById('section-title').innerText = category === 'All' ? '🔥 Latest Releases & Reviews' : `📁 ${category} Movies`;
            
            if(category === 'All') {
                displayMovies(movies);
            } else {
                const filtered = movies.filter(m => m.category === category);
                displayMovies(filtered);
            }
        }

        function openModal(movie) {
            document.getElementById('modal-title').innerText = movie.title;
            document.getElementById('modal-cat').innerText = movie.category;
            document.getElementById('modal-rating').innerText = movie.vote_average;
            document.getElementById('modal-year').innerText = movie.release_date;
            document.getElementById('modal-review').innerText = movie.review;
            document.getElementById('modal-ott-link').href = movie.ott_link;
            
            const trailerContainer = document.getElementById('modal-trailer-container');
            trailerContainer.innerHTML = `<iframe width="100%" height="315" src="${movie.trailer}" title="YouTube trailer" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>`;
            
            document.getElementById('movieModal').style.display = 'block';
        }

        function closeModal() {
            document.getElementById('movieModal').style.display = 'none';
            document.getElementById('modal-trailer-container').innerHTML = '';
        }

        window.onclick = function(event) {
            const modal = document.getElementById('movieModal');
            if (event.target == modal) {
                closeModal();
            }
        }

        function filterMovies() {
            const query = document.getElementById('search-input').value.toLowerCase();
            let baseList = currentCategory === 'All' ? movies : movies.filter(m => m.category === currentCategory);
            const filtered = baseList.filter(m => m.title.toLowerCase().includes(query));
            displayMovies(filtered);
        }

        displayMovies(movies);
    </script>

</body>
</html>
